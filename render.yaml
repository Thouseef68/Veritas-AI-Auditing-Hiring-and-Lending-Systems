services:
  - type: web
    name: veritas-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VERITAS_ENV
        value: production
      - key: VERITAS_API_SECRET
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: veritas-audit-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://veritas-ai-auditor.vercel.app

databases:
  - name: veritas-audit-db
    plan: free
